[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lewm-harness"
version = "0.1.0"
description = "Leak-free walk-forward and Monte Carlo harness for benchmarking a JEPA world model against Kalman and HMM filters."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pytest>=7.4",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "pyarrow>=14",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
